<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루핏</title>
<style>
  /* ── 색과 글꼴 ──────────────────────────────────────────
     여기 값만 바꾸면 앱 전체 색이 한 번에 바뀝니다.
     따뜻한 크림 바탕 + 테라코타 포인트. 제목만 세리프를 씁니다. */
  :root{
    --bg:#F4F1EA;        /* 바탕 — 크림 */
    --card:#FDFBF7;      /* 카드·헤더 — 아주 옅은 크림 */
    --ink:#2E2A25;       /* 본문 글자 — 진한 갈색 */
    --mut:#8A8175;       /* 흐린 글자 — 따뜻한 회색 */
    --line:#E4DED2;      /* 선 — 모래빛 */
    --fill:#F7F3EA;      /* 입력칸 안쪽 */
    --accent:#C2703D;    /* 포인트 — 테라코타 */
    --accent-d:#A85C2E;  /* 눌렀을 때 */
    --accent-l:#F5E9DF;  /* 아주 옅은 테라코타 (카드 배경) */
    --deep:#3E3831;      /* 내 말풍선 */
    --soft:#EDE6D9;      /* 앱 말풍선 — 모래빛 */
    /* 한글은 어디서나 같은 고딕 하나로 통일합니다.
       숫자와 영문만 Georgia 를 씁니다 — Georgia 에는 한글 글자가 없어서
       한글은 자동으로 뒤의 고딕으로 넘어갑니다. 그래서 맥·윈도우가 같아 보입니다.
       (한글 명조는 맥은 AppleMyungjo, 윈도우는 바탕이라 서로 많이 다릅니다) */
    --sans:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --num:Georgia,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);
       color:var(--ink);margin:0;line-height:1.65;font-size:15px;display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased}
  .app{max-width:460px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;
       background:var(--card);border-left:1px solid var(--line);border-right:1px solid var(--line);
       position:relative}

  /* 사진을 끌어올 때 덮이는 안내 — 마우스 이벤트를 가로채지 않도록 pointer-events:none */
  .놓는곳{position:absolute;inset:10px;z-index:5;pointer-events:none;
       border:2px dashed var(--accent);border-radius:16px;background:rgba(245,233,223,.93);
       display:flex;align-items:center;justify-content:center}
  .놓는곳 div{font-family:var(--num);font-size:18px;color:var(--accent-d)}

  header{padding:14px 18px 10px;display:flex;
         align-items:center;gap:10px;background:var(--card)}
  header h1{font-family:var(--num);font-size:21px;letter-spacing:-.2px;margin:0;flex:1;font-weight:400}
  header button{font-family:inherit;font-size:12px;border:1px solid var(--line);background:transparent;
       border-radius:20px;padding:6px 12px;cursor:pointer;color:var(--mut)}
  header button:hover{border-color:var(--accent);color:var(--accent)}

  /* 오늘 남은 양 — 네 가지를 한 줄에. 좁은 화면에서도 줄바꿈 없이 들어가도록
     글자를 작게 잡고 사이를 가운뎃점으로 나눕니다. */
  .영양띠{display:flex;align-items:baseline;justify-content:space-between;gap:4px;
       padding:0 18px 12px;border-bottom:1px solid var(--line);background:var(--card);
       font-size:11px;color:var(--mut);white-space:nowrap}
  .영양띠 span{display:flex;align-items:baseline;gap:3px}
  .영양띠 b{font-family:var(--num);font-weight:400;font-size:16px;color:var(--accent);letter-spacing:-.3px}
  .영양띠 i{font-style:normal;font-size:10px;color:var(--mut)}

  #대화{flex:1;overflow-y:auto;padding:18px 16px 6px;display:flex;flex-direction:column;gap:11px}
  .말{max-width:80%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-break:break-word;
      font-size:14.5px;line-height:1.6}
  .나{align-self:flex-end;background:var(--deep);color:#F7F3EA;border-bottom-right-radius:5px}
  .앱{align-self:flex-start;background:var(--soft);border-bottom-left-radius:5px}
  .앱.경고{background:#FBEDE6;border:1px solid #E3BFA6;color:#8C4520}
  .생각중{align-self:flex-start;color:var(--mut);font-size:13px;padding:4px 6px;font-style:italic}

  .채움{align-self:flex-start;max-width:92%;border:1px solid #E0C7B2;background:var(--accent-l);
        border-radius:14px;padding:13px 15px;font-size:14px}
  .채움 b{font-family:var(--num);font-weight:400;font-size:15px;color:var(--accent-d)}
  .채움 button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;
        color:var(--ink);background:var(--card);border:1px solid #E5D3C2;border-radius:10px;
        padding:10px 12px;margin-top:7px;cursor:pointer;line-height:1.5}
  .채움 button:hover{border-color:var(--accent);background:#fff}
  /* 추천 묶음 — 우리가 아는 곳 / 근처 가게 를 나눠서 보여줍니다 */
  .묶음{margin-top:11px}
  .묶음제목{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--accent-d);
        display:flex;align-items:center;gap:6px}
  .묶음제목 span{font-weight:400;color:var(--mut);font-size:11px;letter-spacing:0}
  .묶음.모름 .묶음제목{color:#8A7A5C}
  .묶음.모름 button{border-color:#DFD5C0;background:#FAF6EC}
  .주의{font-size:11.5px;color:#8A7A5C;margin-top:7px;line-height:1.55}
  .메뉴링크{font-size:11.5px;color:var(--accent-d);text-decoration:underline;margin-right:8px}
  .찾는중{font-size:12px;color:var(--mut);margin-top:9px;font-style:italic}

  .입력칸{border-top:1px solid var(--line);padding:11px 13px;display:flex;gap:8px;background:var(--card);
        align-items:center}
  .입력칸 input[type=text]{flex:1;border:1px solid var(--line);border-radius:22px;background:var(--fill);
        padding:11px 16px;font-family:inherit;font-size:15px;min-width:0;color:var(--ink)}
  .입력칸 input[type=text]:focus{outline:none;border-color:var(--accent)}
  .입력칸 input[type=text]::placeholder{color:#B3A896}
  /* 사진은 보조 동작 — 보내기만 진한 색으로 두어 주 동작을 하나로 만듭니다.
     아래 ".입력칸 button" 규칙보다 우선하도록 선택자를 겹쳐 씁니다. */
  .입력칸 button.사진버튼{border:1px solid var(--line);background:var(--fill);border-radius:22px;
        padding:10px 13px;font-size:17px;cursor:pointer;line-height:1;flex:none;color:var(--ink)}
  .입력칸 button.사진버튼:hover{border-color:var(--accent);background:var(--accent-l)}
  .입력칸 button.사진버튼:disabled{opacity:.35;cursor:default;background:var(--fill)}
  .말 img{display:block;max-width:100%;max-height:240px;border-radius:11px;margin-bottom:7px}
  .입력칸 button{border:none;background:var(--accent);color:#FDFBF7;border-radius:22px;
        padding:11px 19px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .입력칸 button:hover{background:var(--accent-d)}
  .입력칸 button:disabled{background:#CFC5B6;cursor:default}

  .foot{font-size:11px;color:var(--mut);text-align:center;padding:8px 12px 12px;background:var(--card);
        letter-spacing:.2px}

  .판{position:fixed;inset:0;background:rgba(46,42,37,.42);display:flex;align-items:center;
      justify-content:center;padding:16px;z-index:10}
  .판 .속{background:var(--card);border-radius:16px;padding:20px 20px 0;max-width:420px;width:100%;
      max-height:90vh;overflow-y:auto;border:1px solid var(--line)}
  /* 설문이 길어도 [시작하기]가 늘 보이도록 아래에 붙여둡니다 */
  .바닥{position:sticky;bottom:0;background:var(--card);padding-bottom:20px;
      box-shadow:0 -10px 14px -10px rgba(46,42,37,.18)}
  .판 h2{font-family:var(--num);font-weight:400;font-size:20px;margin:0 0 12px;letter-spacing:-.2px}
  label{display:block;font-weight:700;font-size:12px;letter-spacing:.3px;color:var(--mut);
      margin:12px 0 4px;text-transform:none}
  input[type=text],input[type=number],input[type=password]{width:100%;border:1px solid var(--line);
      border-radius:10px;background:var(--fill);padding:9px 12px;font-family:inherit;font-size:15px;
      color:var(--ink)}
  input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{
      outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .btns{display:flex;gap:8px;margin-top:5px}
  .btns.감싸기{flex-wrap:wrap}
  .btns.감싸기 button{flex:1 1 calc(50% - 4px);min-width:0}
  .btns button{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line);
      background:var(--card);border-radius:10px;padding:10px 4px;cursor:pointer;color:var(--ink)}
  .btns button:hover{border-color:var(--accent)}
  .btns button.on{background:var(--accent);color:#FDFBF7;border-color:var(--accent);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chips label{display:inline-flex;align-items:center;gap:5px;font-weight:400;font-size:13.5px;
      letter-spacing:0;color:var(--ink);border:1px solid var(--line);border-radius:20px;
      padding:5px 11px;margin:0;cursor:pointer;background:var(--card);text-transform:none}
  .chips label:hover{border-color:var(--accent)}
  .chips input{margin:0;accent-color:var(--accent)}
  .go{width:100%;font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:11px;
      padding:13px;cursor:pointer;background:var(--accent);color:#FDFBF7;margin-top:14px}
  .go:hover{background:var(--accent-d)}
  /* 보조 동작 — 진한 색은 화면당 하나만 두어야 어디를 눌러야 할지 헷갈리지 않습니다 */
  .go.보조{background:var(--fill);color:var(--ink);border:1px solid var(--line);font-weight:400}
  .go.보조:hover{background:var(--accent-l);border-color:var(--accent)}
  .go.위험{background:#FBEDE6;color:#8C4520;border:1px solid #E3BFA6;font-weight:400}
  .go.위험:hover{background:#F6E0D4}
  .경고상자{background:#FBEDE6;border:1px solid #E3BFA6;color:#8C4520;border-radius:10px;
      padding:11px 13px;margin-top:10px;font-size:13.5px;line-height:1.6}
  .안내{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.6}
  .점검안내{background:#FBEDE6;border:1px solid #E3BFA6;border-radius:10px;padding:13px;line-height:1.65}
  .hide{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>하루핏</h1>
    <button onclick="설정열기()">설정</button>
  </header>
  <!-- 오늘 남은 양 — 한 줄에 네 가지 -->
  <div class="영양띠">
    <span>남은 <b id="남은칼로리">-</b><i>kcal</i></span>
    <span>단백질 <b id="남은단백질">-</b><i>g</i></span>
    <span>탄수 <b id="남은탄수">-</b><i>g</i></span>
    <span>지방 <b id="남은지방">-</b><i>g</i></span>
  </div>

  <div id="대화"></div>

  <div class="입력칸">
    <button class="사진버튼" id="사진버튼" onclick="사진고르기()" title="음식 사진 올리기">📷</button>
    <input type="file" id="사진칸" accept="image/*" capture="environment"
           style="display:none" onchange="사진골랐다(this)">
    <input type="text" id="입력" placeholder="제육덮밥 / 오늘 야근이야 / 단백질 뭐로 채워?"
           onkeydown="if(event.key==='Enter')보내기()" autocomplete="off">
    <button id="보내기버튼" onclick="보내기()">보내기</button>
  </div>

  <div class="foot">
    모든 숫자는 <b>대략</b>입니다 · <b>의료 조언이 아닙니다</b>
  </div>

  <!-- 사진을 끌어올 때만 잠깐 나타납니다 -->
  <div class="놓는곳 hide" id="놓는곳"><div>여기에 놓으면 사진을 읽어요</div></div>
</div>


<!-- ══════ 설문 ══════ -->
<div class="판 hide" id="판-설문"><div class="속">
  <h2 id="설문제목">처음 한 번만 적어주세요</h2>
  <div class="row">
    <div>
      <label>성별</label>
      <div class="btns" id="성별칸">
        <button data-v="남" class="on">남</button><button data-v="여">여</button>
      </div>
    </div>
    <div><label>나이</label><input type="number" id="나이" value="30"></div>
  </div>
  <div class="row">
    <div><label>키 (cm)</label><input type="number" id="키" value="175"></div>
    <div><label>지금 몸무게 (kg)</label><input type="number" id="현재체중" value="78"></div>
  </div>

  <label>목표</label>
  <div class="btns 감싸기" id="목표타입칸">
    <button data-v="체중 감량" class="on">체중 감량</button>
    <button data-v="근력 향상">근력 향상</button>
    <button data-v="체중 유지">체중 유지</button>
    <button data-v="체중 증량">체중 증량</button>
  </div>

  <!-- 감량·증량을 골랐을 때만 나옵니다 -->
  <div id="몸무게목표칸">
    <div class="row">
      <div><label>목표 몸무게 (kg)</label><input type="number" id="목표체중" value="70"></div>
      <div><label>몇 주 안에</label><input type="number" id="기간주" value="12"></div>
    </div>
  </div>

  <label>못 먹는 것 · 다친 곳</label>
  <div class="chips" id="금기칸"></div>
  <div class="안내">없으면 [없음]을 눌러야 넘어갑니다.</div>
  <label>회사나 집 위치</label>
  <input type="text" id="위치" value="강남역 3번 출구">
  <div class="btns" style="margin-top:6px">
    <button type="button" id="위치버튼" onclick="현재위치쓰기()">📍 현재 위치 쓰기</button>
  </div>
  <div class="안내" id="위치안내">
    근처 가게를 추천할 때만 씁니다. 안 눌러도 됩니다 — 적어주신 글자로 씁니다.
  </div>
  <label>코치 말투</label>
  <div class="btns" id="말투칸">
    <button data-v="엄마" class="on">엄마</button>
    <button data-v="스파르타">스파르타</button>
  </div>
  <!-- 설문이 길어서 아래에 붙여둡니다. 스크롤해도 항상 보입니다. -->
  <div class="바닥">
    <div id="설문경고"></div>
    <button class="go" id="설문버튼" onclick="설문저장()">시작하기</button>
    <button class="go 보조 hide" id="설문취소" onclick="설문닫기()">그만두기</button>
  </div>
</div></div>


<!-- ══════ 설정 ══════ -->
<div class="판 hide" id="판-설정"><div class="속">
  <h2>설정</h2>

  <label>코치 말투</label>
  <div class="btns" id="말투칸2">
    <button data-v="엄마">엄마</button><button data-v="스파르타">스파르타</button>
  </div>
  <div class="안내">바꾸면 다음 답변부터 말투가 바뀝니다. 기록은 그대로 남습니다.</div>

  <label>내 정보</label>
  <button class="go 보조" style="margin-top:4px" onclick="설문열기()">목표 몸무게 · 못 먹는 것 · 위치 고치기</button>
  <div class="안내" id="프로필요약"></div>

  <label>AI 연결 (Claude API 키)</label>
  <input type="password" id="키입력" placeholder="sk-ant-...">
  <div class="안내">
    <b>안 넣어도 앱은 돌아갑니다.</b> 넣으면 대화가 훨씬 자연스러워집니다.<br>
    키는 이 브라우저에만 저장되고 어디로도 전송되지 않습니다.<br>
    <b style="color:#8C4520">주의</b> — 발표·공유용 화면에서는 키를 지우세요.
  </div>
  <div id="연결상태" class="안내"></div>

  <div class="바닥">
    <button class="go" onclick="설정닫기()">닫기</button>
    <button class="go 보조" onclick="오늘초기화()">오늘 대화 지우기</button>
    <button class="go 위험" onclick="전체초기화()">전부 지우고 처음부터</button>
  </div>
</div></div>


<!-- ═══ C 의 파일 · A 의 파일을 먼저 읽어들입니다. 순서 바꾸지 마세요 ═══ -->
<script src="data.js"></script>
<script src="talk.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   index.html  —  B 가 혼자 쓰는 파일
   채팅 화면, 저장, AI 호출.  data.js · talk.js 는 열지 않습니다.

   [한 줄이 들어오면 이 순서로 처리합니다]
     1. 입력검사(A)   — 증상·약이면 AI를 부르지 않고 바로 막는다
     2. AI 호출 or 규칙으로답하기(A)
     3. 출력검사(A)   — AI 답에 금지어가 있으면 갈아끼운다
     4. 화면에 표시 + 기록 반영
   ═══════════════════════════════════════════════════════════ */

/* 카카오 지도 키는 data.js(C 담당)에 있습니다. 이 파일에서는 읽기만 합니다.
   없어도 앱은 그대로 돌아갑니다 — "근처 가게" 기능만 빠집니다. */
const 저장키 = "harufit-v2";
let 상태 = { 프로필:null, 키:"", 오늘:{ 날짜:오늘날짜(), 컨디션:null, 일정:null, 기록:[], 대화:[] } };
let 보내는중 = false;

function 오늘날짜(){ return new Date().toISOString().slice(0,10); }

let 저장가능 = true;
function 저장(){
  if(!저장가능) return;
  try{ localStorage.setItem(저장키, JSON.stringify(상태)); }
  catch(e){ 저장가능 = false; console.warn("저장이 안 되는 환경입니다. 앱은 그대로 쓸 수 있습니다."); }

    if(d.키) 상태.키 = d.키;
    if(d.오늘 && d.오늘.날짜 === 오늘날짜()) 상태.오늘 = d.오늘;
    else if(d.오늘) 상태.어제 = d.오늘;

}

/* 사진을 올린 경우 — 화면에는 사진을 보여주고, 저장에는 글자만 남깁니다.

/* ── 탄수화물 · 지방 ────────────────────────────────────
   음식표에도 기준값계산에도 탄수·지방이 없습니다. 그래서 칼로리와 단백질에서
   되짚어 계산합니다.

     칼로리 = 탄수×4 + 단백질×4 + 지방×9

   단백질이 쓴 칼로리를 빼고 남은 칼로리를, 탄수:지방 = 6:4 로 나눕니다.
   영양 계산에서 흔히 쓰는 비율이고, 이 앱의 숫자는 모두 대략값입니다.
   ★ AI 가 직접 알려준 값이 있으면 그쪽을 먼저 씁니다(아래 답받기 참고).
   ★ 나중에 C 가 음식표에 탄수화물·지방을 넣으면 그 값이 우선 쓰입니다. */
function 영양추정(kcal, 단백질){
  const 남은 = Math.max(0, (kcal || 0) - (단백질 || 0) * 4);
  return { 탄수화물: Math.round(남은 * 0.6 / 4), 지방: Math.round(남은 * 0.4 / 9) };
}
/* 기록 한 줄에 탄수·지방을 채워 넣습니다. 이미 있으면 그대로 둡니다. */
function 영양채우기(끼니){
  const 추정 = 영양추정(끼니.kcal, 끼니.단백질);
  return {
    이름: 끼니.이름, kcal: 끼니.kcal || 0, 단백질: 끼니.단백질 || 0,
    탄수화물: (끼니.탄수화물 != null) ? 끼니.탄수화물 : 추정.탄수화물,
    지방:     (끼니.지방     != null) ? 끼니.지방     : 추정.지방
  };
}

function 숫자갱신(){
  if(!상태.프로필) return;
  const 기준 = 기준값계산(상태.프로필);                       // ← data.js
  const 합 = 항목 => 상태.오늘.기록.reduce((a,b)=>a+(b[항목]||0),0);

  const 목표탄수지방 = 영양추정(기준.목표kcal, 기준.목표단백질);
  const 남은 = {
    남은칼로리: 기준.목표kcal      - 합("kcal"),
    남은단백질: 기준.목표단백질    - 합("단백질"),
    남은탄수:   목표탄수지방.탄수화물 - 합("탄수화물"),
    남은지방:   목표탄수지방.지방     - 합("지방")
  };
  for(const id in 남은){
    const v = 남은[id];
    document.getElementById(id).textContent = Number.isFinite(v) ? Math.round(v) : "-";
  }
}

/* ── 주변 가게 새로 찾기 ── data.js 의 주변갱신()을 부릅니다.
   식당표를 그 동네 것으로 갈아 끼웁니다. 실패하면 아무 일도 안 일어납니다 —
   강남역 기준 목록이 그대로 남습니다. C 가 없는 버전이어도 안 깨지도록 감쌉니다. */
function 주변찾아보기(위치글){
  if(typeof 주변갱신 !== "function") return;          // ← data.js 에 아직 없으면 조용히 넘어감
  Promise.resolve(주변갱신(위치글))
    .then(결과 => {

      else if(결과) console.info("주변 갱신 안 함 —", 결과.까닭);
    })
    .catch(e => console.warn("주변 갱신 실패 —", e.message));
}


/* ── 부족분 채우기 카드 ──────────────────────────────────
   식당표는 C 가 관리합니다. 설문을 저장하면 그 동네 가게로 바뀌고,
   못 찾으면 기본 목록(강남역)이 남습니다. 어느 쪽이든 재료가 적혀 있고,
   안전검사를 통과한 것만 보여줍니다 — 모르면 추천하지 않습니다. */
function 채움카드(){
  const 기준 = 기준값계산(상태.프로필);
  const 남은단백질 = 기준.목표단백질 - 상태.오늘.기록.reduce((a,b)=>a+(b.단백질||0),0);
  if(남은단백질 <= 15 || 상태.오늘.기록.length === 0) return;

  const 통과 = 안전검사(식당표, 상태.프로필.못먹는것)           // ← talk.js + data.js
               .filter(m => m.거리 <= 500)
               .sort((a,b)=>b.단백질-a.단백질)
               .slice(0,3);
  if(!통과.length) return;

  const d = document.createElement("div");
  d.className = "채움";
  d.innerHTML =
    "<b>" + 문장만들기(상태.프로필.말투,"부족",{g:남은단백질}) + "</b> " +
    상태.프로필.위치 + " 기준 500m 안이야." +
    '<div class="묶음 아는곳">' +
    통과.map(m => {
      const 지도 = (typeof 지도링크 === "function") ? 지도링크(m.메뉴) : (m.지도 || null);
      return '<button onclick="메뉴탭(\'' + m.메뉴 + '\')">' +
             m.가게 + ' · ' + m.메뉴 + ' — ' + m.거리 + 'm · 단백질 ' + m.단백질 + 'g</button>' +
             (지도 ? '<a class="메뉴링크" href="' + 지도 + '" target="_blank" rel="noopener">' +
                     m.가게 + ' 지도 보기</a>' : '');
    }).join("") +
    '</div>';
  document.getElementById("대화").appendChild(d);
  아래로();
}

/* ── 사진 ──────────────────────────────────────────────
   사진은 AI가 있어야 알아볼 수 있습니다. 규칙만으로는 그림을 읽을 수 없습니다.
   보내기 전에 크기를 줄입니다 — 원본 사진은 3~5MB라 느리고 비쌉니다. */
function 사진쓸수있나(){
  if(!상태.프로필) return false;
  if(!상태.키){
    앱말("사진은 AI 연결이 있어야 알아볼 수 있어.\n설정에서 키를 넣거나, 먹은 걸 글로 적어줘.", true);
    return false;
  }
  return true;
}
function 사진고르기(){
  if(!사진쓸수있나()) return;
  document.getElementById("사진칸").click();
}

/* 긴 쪽을 1024px 로 줄이고 JPEG 로 다시 만듭니다 */
function 사진줄이기(파일, 최대){
  return new Promise((성공, 실패) => {
    const reader = new FileReader();
    reader.onerror = () => 실패(new Error("사진을 읽지 못했습니다"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => 실패(new Error("사진 형식을 알 수 없습니다"));
      img.onload = () => {
        const 비율 = Math.min(1, 최대 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width  = Math.round(img.width  * 비율);
        c.height = Math.round(img.height * 비율);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.8);
        성공({ 미리보기:url, base64:url.split(",")[1] });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(파일);
  });
}

/* 사진을 어떻게 가져왔든(버튼·드래그·붙여넣기) 여기로 모입니다 */
async function 사진처리(파일){
  if(!파일 || 보내는중) return;
  if(!파일.type || !파일.type.startsWith("image/")){
    앱말("사진 파일만 알아볼 수 있어. 먹은 걸 글로 적어줘도 돼.", true);
    return;
  }
  if(!사진쓸수있나()) return;

  let 사진;
  try{
    사진 = await 사진줄이기(파일, 1024);
  }catch(e){
    앱말(e.message + ". 다른 사진으로 해볼래?", true);
    return;
  }
  const 입력 = document.getElementById("입력");
  const 글 = 입력.value.trim();
  입력.value = "";
  내사진(사진.미리보기, 글);
  await 답받기(글 || "이 사진에 있는 음식을 알려줘.", 사진.base64);
}

function 사진골랐다(칸){
  const 파일 = 칸.files && 칸.files[0];
  칸.value = "";                       // 같은 사진을 다시 고를 수 있게
  사진처리(파일);
}

/* ── 드래그해서 놓기 · 붙여넣기 ────────────────────────
   컴퓨터에서는 사진을 창에 끌어다 놓거나 Ctrl/Cmd+V 로 붙여넣을 수 있습니다.
   버튼을 찾지 않아도 되니 훨씬 빠릅니다. */
function 사진받는법붙이기(){
  const 앱 = document.querySelector(".app");
  const 덮개 = document.getElementById("놓는곳");
  let 깊이 = 0;                          // 자식 위로 지나가도 깜빡이지 않게 셉니다

  const 사진끄는중 = ev =>
    ev.dataTransfer && [...ev.dataTransfer.types].includes("Files");

  앱.addEventListener("dragenter", ev => {
    if(!사진끄는중(ev)) return;
    ev.preventDefault(); 깊이++; 덮개.classList.remove("hide");
  });
  앱.addEventListener("dragover", ev => { if(사진끄는중(ev)) ev.preventDefault(); });
  앱.addEventListener("dragleave", () => { if(--깊이 <= 0){ 깊이 = 0; 덮개.classList.add("hide"); } });
  앱.addEventListener("drop", ev => {
    if(!사진끄는중(ev)) return;
    ev.preventDefault(); 깊이 = 0; 덮개.classList.add("hide");
    사진처리(ev.dataTransfer.files && ev.dataTransfer.files[0]);
  });

  document.addEventListener("paste", ev => {
    const 것들 = ev.clipboardData && ev.clipboardData.items;
    if(!것들) return;
    for(const 것 of 것들){
      if(것.type && 것.type.startsWith("image/")){
        ev.preventDefault();
        사진처리(것.getAsFile());
        return;
      }
    }
  });
}

/* ── 한 줄 보내기 ── */
async function 보내기(){
  if(보내는중) return;
  const 입력 = document.getElementById("입력");
  const 글 = 입력.value.trim();
  if(!글 || !상태.프로필) return;
  입력.value = "";
  내말(글);
  await 답받기(글, null);
}

/* 글이든 사진이든 여기서 처리합니다. 사진이면 입력검사를 건너뜁니다 —
   그림에는 검사할 글자가 없습니다. 출력검사는 사진일 때도 그대로 합니다. */
async function 답받기(글, 사진){
  // 1. 입력 검사 — AI를 부르기 전에 막는다
  const 막기 = 사진 ? { 막힘:false } : 입력검사(글);            // ← talk.js
  if(막기.막힘){ 앱말(막기.답, true); return; }

  보내는중 = true;
  document.getElementById("보내기버튼").disabled = true;
  document.getElementById("사진버튼").disabled = true;
  const 기다림 = document.createElement("div");
  기다림.className = "생각중";
  기다림.textContent = 사진 ? "사진 보는 중…" : "생각 중…";
  document.getElementById("대화").appendChild(기다림);
  아래로();

  let 결과;
  try{
    // 2. AI 호출 (키가 있으면) 또는 규칙으로 답하기
    결과 = 상태.키 ? await AI에게물어보기(글, 사진) : 규칙으로답하기(글, 상태.프로필, 상태.오늘);
  }catch(e){
    console.warn("AI 호출 실패 — 규칙으로 대신합니다:", e.message);
    결과 = 사진
      ? { 종류:"기타", 음식:[], 컨디션:null, 일정:null,
          답:"사진을 못 알아봤어. 뭘 먹었는지 글로 적어줄래?" }
      : 규칙으로답하기(글, 상태.프로필, 상태.오늘);            // ← talk.js
  }
  기다림.remove();

  // 3. 출력 검사 — AI 답에 금지어가 있으면 갈아끼운다
  const 검사 = 출력검사(결과.답 || "");                        // ← talk.js
  앱말(검사.답, 검사.막힘);

  // 4. 기록 반영
  if(결과.컨디션) 상태.오늘.컨디션 = 결과.컨디션;
  if(결과.일정)   상태.오늘.일정   = 결과.일정;
  (결과.음식 || []).forEach(m => {
    상태.오늘.기록.push(영양채우기(m));   // AI 가 탄수·지방을 줬으면 그 값을 그대로 씁니다
  });
  저장(); 숫자갱신();
  if(결과.종류 === "음식") 채움카드();

  보내는중 = false;
  document.getElementById("보내기버튼").disabled = false;
  document.getElementById("사진버튼").disabled = false;
  document.getElementById("입력").focus();
}

/* ── AI 호출 ──
   브라우저에서 직접 부르므로 anthropic-dangerous-direct-browser-access 헤더가 필요합니다.
   file:// 로 열면 막힙니다 — 로컬 서버나 GitHub Pages에서 열어야 합니다.

   사진이 있으면 마지막 차례에 사진을 같이 붙입니다. 사진은 저장하지 않고
   이번 요청에만 씁니다. */
async function AI에게물어보기(글, 사진){
  let 최근 = 상태.오늘.대화.slice(-8).map(m => ({
    role: m.누가==="나" ? "user" : "assistant",
    content: m.글
  }));
  // 첫 차례는 반드시 사용자여야 합니다. 앱 인사말로 시작하면 잘라냅니다.
  while(최근.length && 최근[0].role === "assistant") 최근.shift();
  if(!최근.length) 최근 = [{ role:"user", content:글 }];

  if(사진){
    최근[최근.length - 1] = {
      role: "user",
      content: [
        { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:사진 } },
        { type:"text", text:글 }
      ]
    };
  }

  const 응답 = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": 상태.키,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-opus-5",
      max_tokens: 2048,
      output_config: {
        effort: "low",
        format: { type: "json_schema", schema: 답변형식 }        // ← talk.js
      },
      system: 시스템지시문(상태.프로필, 상태.오늘),               // ← talk.js
      messages: 최근
    })
  });

  if(!응답.ok){
    const t = await 응답.text();
    throw new Error("API " + 응답.status + " " + t.slice(0,200));
  }
  const data = await 응답.json();

  // 거절당했으면 규칙으로 넘긴다
  if(data.stop_reason === "refusal") throw new Error("refusal");

  const 글블록 = (data.content || []).find(b => b.type === "text");
  if(!글블록) throw new Error("빈 응답");
  return JSON.parse(글블록.text);
}

/* ── 추천 메뉴를 누르면 그게 곧 기록이 된다 ── */
function 메뉴탭(메뉴){
  const m = 식당표.find(x => x.메뉴 === 메뉴);
  if(!m) return;
  상태.오늘.기록.push(영양채우기({ 이름:메뉴, kcal:m.kcal, 단백질:m.단백질,
                                    탄수화물:m.탄수화물, 지방:m.지방 }));
  저장(); 숫자갱신();
  앱말(문장만들기(상태.프로필.말투, "기록", {메뉴:메뉴, kcal:m.kcal}));
}

/* ── 설문 · 설정 ── */
function 버튼묶음(칸id, 콜백){
  const 칸 = document.getElementById(칸id);
  칸.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      칸.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      if(콜백) 콜백(b.dataset.v);
    };
  });
}
function 선택값(칸id){
  const b = document.getElementById(칸id).querySelector("button.on");
  return b ? b.dataset.v : null;
}
function 금기칸그리기(){
  document.getElementById("금기칸").innerHTML = 금기후보.map(x =>
    '<label><input type="checkbox" value="'+x+'">'+x+'</label>').join("");
}

/* 목표 몸무게·기간은 감량·증량일 때만 물어봅니다.
   근력 향상이나 유지는 몸무게 목표가 없는 게 자연스럽습니다. */
const 몸무게목표필요 = 타입 => 타입 === "체중 감량" || 타입 === "체중 증량";
function 목표칸맞추기(){
  const 타입 = 선택값("목표타입칸") || "체중 감량";
  document.getElementById("몸무게목표칸").classList.toggle("hide", !몸무게목표필요(타입));
}
/* 설문 판 열기 —
   처음이면 빈 화면, 나중에 고칠 때는 지금 값을 채워서 엽니다. */
function 설문열기(){
  const 고치기 = !!상태.프로필;
  document.getElementById("설문제목").textContent = 고치기 ? "내 정보 고치기" : "처음 한 번만 적어주세요";
  document.getElementById("설문버튼").textContent = 고치기 ? "저장하기" : "시작하기";
  document.getElementById("설문취소").classList.toggle("hide", !고치기);
  document.getElementById("설문경고").innerHTML = "";

  document.getElementById("위치안내").innerHTML =
    (상태.프로필 && 상태.프로필.위치 === 현재위치표시)
      ? '지금은 <b style="color:#A85C2E">현재 위치</b>를 쓰고 있습니다. ' +
        '주소를 직접 적으면 그 동네로 바뀝니다.'
      : '근처 가게를 찾을 때 씁니다. [현재 위치]를 누르면 지금 있는 곳으로 찾습니다.';

  if(고치기){
    const p = 상태.프로필;
    document.getElementById("나이").value = p.나이 || 30;
    document.getElementById("키").value = p.키;
    document.getElementById("현재체중").value = p.현재체중;
    document.getElementById("목표체중").value = p.목표체중;
    document.getElementById("기간주").value = p.기간주;
    document.getElementById("위치").value = p.위치;
    document.querySelectorAll("#성별칸 button").forEach(b=>
      b.classList.toggle("on", b.dataset.v === (p.성별 || "남")));
    document.querySelectorAll("#목표타입칸 button").forEach(b=>
      b.classList.toggle("on", b.dataset.v === (p.목표타입 || "체중 감량")));
    document.querySelectorAll('#금기칸 input').forEach(i=>{
      i.checked = p.못먹는것.includes(i.value) || (p.못먹는것.length===0 && i.value==="없음");
    });
    document.querySelectorAll("#말투칸 button").forEach(b=>
      b.classList.toggle("on", b.dataset.v === p.말투));
  }
  목표칸맞추기();
  document.getElementById("판-설정").classList.add("hide");
  document.getElementById("판-설문").classList.remove("hide");
}
function 설문닫기(){
  document.getElementById("판-설문").classList.add("hide");
}

function 설문저장(){
  const 고치기 = !!상태.프로필;
  const 이전금기 = 고치기 ? 상태.프로필.못먹는것.slice() : [];

  const 현재체중 = +document.getElementById("현재체중").value;
  const 목표타입 = 선택값("목표타입칸") || "체중 감량";

  /* 감량·증량이 아니면 몸무게 목표를 안 물어봅니다.
     그래도 목표체중·기간주는 "현재 몸무게 유지"로 채워서 저장합니다 —
     data.js 의 기준값계산·목표안전한가가 이 두 값을 쓰고 있어서,
     비워두면 그쪽이 깨집니다. 필드를 없애지 않고 채우는 쪽을 택했습니다. */
  const 몸무게목표 = 몸무게목표필요(목표타입)
    ? { 목표체중:+document.getElementById("목표체중").value,
        기간주:+document.getElementById("기간주").value }
    : { 목표체중:현재체중, 기간주:12 };

  const 프로필 = {
    성별:선택값("성별칸") || "남",
    나이:+document.getElementById("나이").value,
    키:+document.getElementById("키").value,
    현재체중:현재체중,
    목표타입:목표타입,
    목표체중:몸무게목표.목표체중,
    기간주:몸무게목표.기간주,
    못먹는것:[...document.querySelectorAll('#금기칸 input:checked')]
              .map(i=>i.value).filter(v=>v!=="없음"),
    위치:document.getElementById("위치").value,
    말투:선택값("말투칸") || "엄마"
  };
  const 경고 = document.getElementById("설문경고");
  if(document.querySelectorAll('#금기칸 input:checked').length === 0){
    경고.innerHTML = '<div class="경고상자">못 먹는 것을 확인해 주세요. 없으면 <b>[없음]</b>을 눌러야 넘어갑니다.</div>';
    return;
  }
  const 판정 = 목표안전한가(프로필);                            // ← data.js
  if(!판정.ok){ 경고.innerHTML = '<div class="경고상자">'+판정.메시지+'</div>'; return; }

  경고.innerHTML = "";
  상태.프로필 = 프로필;
  저장();
  주변찾아보기(프로필.위치);            // ← data.js 가 그 동네 가게로 식당표를 갈아 끼웁니다
  document.getElementById("판-설문").classList.add("hide");

  if(!고치기){ 대화그리기(); 숫자갱신(); return; }

  // ── 고친 경우 ──
  숫자갱신();
  // ★ 못 먹는 것이 바뀌었으면, 이미 화면에 떠 있는 추천을 다시 검사한다.
  //   안 그러면 방금 등록한 금기가 든 메뉴가 화면에 그대로 남는다.
  const 금기바뀜 = 이전금기.join() !== 프로필.못먹는것.join();
  if(금기바뀜) 카드재검사();
  앱말(바뀐것안내(이전금기, 프로필));
}

/* 화면에 남아 있는 추천 카드를 새 금기로 다시 거른다.
   ★ "우리가 아는 곳" 묶음에만 적용합니다.
     "근처 가게"는 애초에 재료를 모르는 곳이라 거르지 않습니다.
     거르는 시늉을 하면 안전하다고 오해하게 됩니다. */
function 카드재검사(){
  document.querySelectorAll(".채움").forEach(카드 => {
    const 아는곳 = 카드.querySelector(".묶음.아는곳");
    if(아는곳){
      let 남은개수 = 0;
      아는곳.querySelectorAll("button").forEach(b => {
        const 메뉴 = (b.getAttribute("onclick").match(/'([^']+)'/) || [])[1];
        const m = 식당표.find(x => x.메뉴 === 메뉴);
        const 통과 = m && 안전검사([m], 상태.프로필.못먹는것).length > 0;   // ← talk.js
        if(통과) 남은개수++; else b.remove();
      });
      if(남은개수 === 0) 아는곳.remove();
    }
    // 두 묶음이 다 비었으면 카드째 지운다
    if(!카드.querySelector(".묶음")) 카드.remove();
  });
}

function 바뀐것안내(이전금기, p){
  const 새금기 = p.못먹는것.filter(x => !이전금기.includes(x));
  const 기준 = 기준값계산(p);
  let 글 = "알겠어. 이제 하루 " + 기준.목표kcal + "kcal, 단백질 " + 기준.목표단백질 + "g으로 볼게.";
  if(새금기.length) 글 += "\n" + 새금기.join(", ") + " 들어간 건 앞으로 추천 안 할게.";
  return 글;
}
function 설정열기(){
  document.getElementById("키입력").value = 상태.키 || "";
  document.querySelectorAll("#말투칸2 button").forEach(b=>
    b.classList.toggle("on", b.dataset.v === (상태.프로필 && 상태.프로필.말투)));
  프로필요약그리기();
  연결상태그리기();
  document.getElementById("판-설정").classList.remove("hide");
}
function 프로필요약그리기(){
  const p = 상태.프로필;
  if(!p) return;
  const 몸무게 = 몸무게목표필요(p.목표타입)
    ? p.현재체중 + "kg → " + p.목표체중 + "kg (" + p.기간주 + "주)"
    : p.현재체중 + "kg 유지";
  document.getElementById("프로필요약").innerHTML =
    "지금 — " + (p.목표타입 || "체중 감량") + " · " + 몸무게 + "<br>" +
    (p.성별 || "남") + " · " + (p.나이 || "-") + "세 · " + p.키 + "cm · " +
    "못 먹는 것: " + (p.못먹는것.join(", ") || "없음") + " · " +
    (p.위치 === 현재위치표시 ? "현재 위치 사용 중" : p.위치);
}
function 설정닫기(){
  상태.키 = document.getElementById("키입력").value.trim();
  저장();
  document.getElementById("판-설정").classList.add("hide");
}
function 연결상태그리기(){
  const el = document.getElementById("연결상태");
  const file = location.protocol === "file:";
  el.innerHTML = file
    ? '<b style="color:#8C4520">지금은 파일을 직접 열어서 AI 연결이 안 됩니다.</b><br>로컬 서버나 GitHub Pages로 열어야 합니다. (AI 없이도 앱은 그대로 돌아갑니다)'
    : (상태.키 ? "AI 연결됨" : "AI 미연결 — 준비된 답으로 대신합니다");
}
function 오늘초기화(){
  상태.오늘 = { 날짜:오늘날짜(), 컨디션:null, 일정:null, 기록:[], 대화:[] };
  저장(); 대화그리기(); 숫자갱신(); 설정닫기();
}
function 전체초기화(){ try{ localStorage.removeItem(저장키); }catch(e){} location.reload(); }

/* ── 파일 점검 ──────────────────────────────────────────
   talk.js 나 data.js 에 문법 오류(쉼표·따옴표 빠짐)가 있으면
   그 파일의 내용이 통째로 사라집니다. 그대로 두면 하얀 화면만 남고
   원인을 알 수 없습니다. 그래서 시작하기 전에 먼저 확인하고,
   빠진 게 있으면 무엇이 없는지 화면에 적어줍니다.

   typeof 는 선언되지 않은 이름에도 안전합니다. 그래서 여기서는 터지지 않습니다. */
function 계약점검(){
  const 없는것 = { "talk.js (A 담당)":[], "data.js (C 담당)":[] };
  const A = 없는것["talk.js (A 담당)"], C = 없는것["data.js (C 담당)"];

  if(typeof 입력검사       !== "function") A.push("입력검사");
  if(typeof 출력검사       !== "function") A.push("출력검사");
  if(typeof 안전검사       !== "function") A.push("안전검사");
  if(typeof 시스템지시문   !== "function") A.push("시스템지시문");
  if(typeof 규칙으로답하기 !== "function") A.push("규칙으로답하기");
  if(typeof 문장만들기     !== "function") A.push("문장만들기");
  if(typeof 답변형식       !== "object")   A.push("답변형식");

  if(typeof 음식표       === "undefined" || !Array.isArray(음식표))   C.push("음식표");
  if(typeof 식당표       === "undefined" || !Array.isArray(식당표))   C.push("식당표");
  if(typeof 금기후보     === "undefined" || !Array.isArray(금기후보)) C.push("금기후보");
  if(typeof 기준값계산   !== "function") C.push("기준값계산");
  if(typeof 목표안전한가 !== "function") C.push("목표안전한가");
  if(typeof 음식찾기     !== "function") C.push("음식찾기");

  const 깨진파일 = Object.keys(없는것).filter(k => 없는것[k].length);
  if(!깨진파일.length) return true;

  document.body.innerHTML =
    '<div style="max-width:460px;margin:40px auto;padding:22px;font-size:15px;line-height:1.7">' +
    '<h2 style="color:#8C4520;margin:0 0 10px">앱을 열 수 없습니다</h2>' +
    깨진파일.map(f =>
      '<p><b>' + f + '</b> 를 읽지 못했습니다.<br>' +
      '<span style="color:#8A8175">없는 것 — ' + 없는것[f].join(", ") + '</span></p>').join("") +
    '<p class="점검안내">' +
    '거의 항상 그 파일에 <b>쉼표(,)나 따옴표(")가 하나 빠진 것</b>입니다.<br>' +
    '<b>F12 → Console</b> 의 빨간 줄에 몇 번째 줄인지 나옵니다.<br>' +
    '그 줄을 담당자에게 그대로 알려주세요.</p></div>';
  return false;
}

/* 앱이 도는 데 지장은 없지만 나중에 이상하게 보이는 것들 — 콘솔에만 알려줍니다 */
function 잔소리(){
  if(Array.isArray(금기후보) && !금기후보.includes("없음"))
    console.warn("점검 — data.js 의 금기후보에 \"없음\"이 없습니다. 못 먹는 게 없는 사람이 설문을 넘어갈 수 없습니다.");
  ["첫인사","기록","부족"].forEach(키 => {
    if(!문장만들기("엄마", 키, {}))
      console.warn("점검 — talk.js 의 문장틀에 \"" + 키 + "\" 문장이 없습니다. 그 자리가 빈칸으로 나옵니다.");
  });
  if(Array.isArray(식당표) && !식당표.some(m => (m.들어간것||[]).includes("땅콩")))
    console.warn("점검 — data.js 식당표에 땅콩이 든 메뉴가 없습니다. 발표 안전 시연을 보여줄 수 없습니다.");
  if(typeof 주변갱신 !== "function")
    console.warn("점검 — data.js 에 주변갱신()이 없습니다. 근처 가게를 실시간으로 못 찾습니다 (기본 목록으로 동작).");
  if(typeof 카카오JS키 === "undefined" || !카카오JS키)
    console.warn("점검 — data.js 에 카카오JS키가 없습니다. 근처 가게 검색이 안 됩니다. C에게 알려주세요.");
}

/* ── 시작 ── */
if(계약점검()){
  잔소리();
  사진받는법붙이기();
  불러오기();
  금기칸그리기();
  버튼묶음("성별칸");
  버튼묶음("목표타입칸", 목표칸맞추기);   // 목표를 바꾸면 아래 칸이 나타나거나 사라집니다
  버튼묶음("말투칸");
  버튼묶음("말투칸2", v=>{ if(상태.프로필){ 상태.프로필.말투=v; 저장(); } });
  if(상태.프로필){
    대화그리기(); 숫자갱신();
  } else {
    설문열기();
  }
}
</script>
