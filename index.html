<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루핏</title>
<style>
  :root{ --navy:#1F2A37; --accent:#149E9C; --gold:#C29A5B; --ink:#242A33;
         --mut:#6b7280; --line:#e2e6ec; --bg:#f4f6f9; --card:#fff; --fill:#fbfdfd; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);
       color:var(--ink);margin:0;line-height:1.6;font-size:15px;display:flex;flex-direction:column}
  .app{max-width:460px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;
       background:var(--card);border-left:1px solid var(--line);border-right:1px solid var(--line)}

  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;background:var(--card)}
  header h1{font-size:17px;margin:0;flex:1}
  header .num{font-size:12px;color:var(--mut);text-align:right;line-height:1.35}
  header .num b{color:var(--navy);font-size:14px}
  header button{font-family:inherit;font-size:12px;border:1px solid var(--line);background:#fff;
       border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--mut)}

  #대화{flex:1;overflow-y:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:9px}
  .말{max-width:82%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .나{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .앱{align-self:flex-start;background:#eef1f5;border-bottom-left-radius:4px}
  .앱.경고{background:#fff4f2;border:1px solid #f0c9c1;color:#9a3412}
  .생각중{align-self:flex-start;color:var(--mut);font-size:13px;padding:4px 6px}

  .채움{align-self:flex-start;max-width:92%;border:1px solid var(--accent);background:#f2fbfa;
        border-radius:12px;padding:10px 12px;font-size:14px}
  .채움 b{color:#0f766e}
  .채움 button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;
        background:#fff;border:1px solid #bfe2de;border-radius:8px;padding:8px 10px;
        margin-top:6px;cursor:pointer}
  /* 추천 묶음 — 우리가 아는 곳 / 근처 가게 를 나눠서 보여줍니다 */
  .묶음{margin-top:9px}
  .묶음제목{font-size:12px;font-weight:700;color:#0f766e;display:flex;align-items:center;gap:6px}
  .묶음제목 span{font-weight:400;color:var(--mut);font-size:11.5px}
  .묶음.모름 .묶음제목{color:#92400e}
  .묶음.모름 button{border-color:#f0dcb8}
  .주의{font-size:11.5px;color:#92400e;margin-top:5px;line-height:1.5}
  .메뉴링크{font-size:11.5px;color:#0f766e;text-decoration:underline;margin-left:6px}
  .찾는중{font-size:12px;color:var(--mut);margin-top:8px}

  .입력칸{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;background:var(--card);
        align-items:center}
  .입력칸 input[type=text]{flex:1;border:1px solid var(--line);border-radius:20px;background:var(--fill);
        padding:10px 15px;font-family:inherit;font-size:15px;min-width:0}
  .사진버튼{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 12px;
        font-size:17px;cursor:pointer;line-height:1;flex:none}
  .사진버튼:disabled{opacity:.4;cursor:default}
  .말 img{display:block;max-width:100%;max-height:240px;border-radius:10px;margin-bottom:6px}
  .입력칸 button{border:none;background:var(--accent);color:#fff;border-radius:20px;
        padding:10px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .입력칸 button:disabled{background:#c7d0d6;cursor:default}

  .foot{font-size:11px;color:var(--mut);text-align:center;padding:6px 12px 10px;background:var(--card)}

  .판{position:fixed;inset:0;background:rgba(31,42,55,.45);display:flex;align-items:center;
      justify-content:center;padding:16px;z-index:10}
  .판 .속{background:#fff;border-radius:14px;padding:18px 20px 20px;max-width:420px;width:100%;
      max-height:88vh;overflow-y:auto}
  .판 h2{font-size:16px;margin:0 0 10px}
  label{display:block;font-weight:700;font-size:13px;margin:10px 0 3px}
  input[type=text],input[type=number],input[type=password]{width:100%;border:1px solid var(--line);
      border-radius:8px;background:var(--fill);padding:9px 11px;font-family:inherit;font-size:15px}
  .row{display:flex;gap:9px}.row>*{flex:1}
  .btns{display:flex;gap:7px;margin-top:4px}
  .btns button{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line);
      background:#fff;border-radius:9px;padding:9px 4px;cursor:pointer;color:var(--ink)}
  .btns button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chips label{display:inline-flex;align-items:center;gap:5px;font-weight:400;font-size:13.5px;
      border:1px solid var(--line);border-radius:20px;padding:5px 11px;margin:0;cursor:pointer;background:#fff}
  .chips input{margin:0}
  .go{width:100%;font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:10px;
      padding:12px;cursor:pointer;background:var(--accent);color:#fff;margin-top:14px}
  .경고상자{background:#fff4f2;border:1px solid #f0c9c1;color:#9a3412;border-radius:9px;
      padding:10px 12px;margin-top:9px;font-size:13.5px}
  .안내{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.5}
  .hide{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>하루핏</h1>
    <div class="num">남은 <b id="남은칼로리">-</b> kcal<br>단백질 <b id="남은단백질">-</b> g</div>
    <button onclick="설정열기()">설정</button>
  </header>

  <div id="대화"></div>

  <div class="입력칸">
    <button class="사진버튼" id="사진버튼" onclick="사진고르기()" title="음식 사진 올리기">📷</button>
    <input type="file" id="사진칸" accept="image/*" capture="environment"
           style="display:none" onchange="사진골랐다(this)">
    <input type="text" id="입력" placeholder="제육덮밥 / 오늘 야근이야 / 단백질 뭐로 채워?"
           onkeydown="if(event.key==='Enter')보내기()" autocomplete="off">
    <button id="보내기버튼" onclick="보내기()">보내기</button>
  </div>

  <div class="foot">
    모든 숫자는 <b>대략</b>입니다 · <b>의료 조언이 아닙니다</b>
  </div>
</div>


<!-- ══════ 설문 ══════ -->
<div class="판 hide" id="판-설문"><div class="속">
  <h2 id="설문제목">처음 한 번만 적어주세요</h2>
  <div class="row">
    <div><label>키 (cm)</label><input type="number" id="키" value="175"></div>
    <div><label>지금 몸무게 (kg)</label><input type="number" id="현재체중" value="78"></div>
  </div>
  <div class="row">
    <div><label>목표 몸무게 (kg)</label><input type="number" id="목표체중" value="70"></div>
    <div><label>몇 주 안에</label><input type="number" id="기간주" value="12"></div>
  </div>
  <label>못 먹는 것 · 다친 곳</label>
  <div class="chips" id="금기칸"></div>
  <div class="안내">없으면 [없음]을 눌러야 넘어갑니다.</div>
  <label>회사나 집 위치</label>
  <input type="text" id="위치" value="강남역 3번 출구">
  <div class="btns" style="margin-top:6px">
    <button type="button" id="위치버튼" onclick="현재위치쓰기()">📍 현재 위치 쓰기</button>
  </div>
  <div class="안내" id="위치안내">
    근처 가게를 추천할 때만 씁니다. 안 눌러도 됩니다 — 적어주신 글자로 씁니다.
  </div>
  <label>코치 말투</label>
  <div class="btns" id="말투칸">
    <button data-v="엄마" class="on">엄마</button>
    <button data-v="스파르타">스파르타</button>
  </div>
  <button class="go" id="설문버튼" onclick="설문저장()">시작하기</button>
  <button class="go hide" id="설문취소" style="background:#eef1f5;color:#374151"
          onclick="설문닫기()">그만두기</button>
  <div id="설문경고"></div>
</div></div>


<!-- ══════ 설정 ══════ -->
<div class="판 hide" id="판-설정"><div class="속">
  <h2>설정</h2>

  <label>코치 말투</label>
  <div class="btns" id="말투칸2">
    <button data-v="엄마">엄마</button><button data-v="스파르타">스파르타</button>
  </div>
  <div class="안내">바꾸면 다음 답변부터 말투가 바뀝니다. 기록은 그대로 남습니다.</div>

  <label>내 정보</label>
  <button class="go" style="background:#eef1f5;color:#374151;margin-top:2px"
          onclick="설문열기()">목표 몸무게 · 못 먹는 것 · 위치 고치기</button>
  <div class="안내" id="프로필요약"></div>

  <label>AI 연결 (Claude API 키)</label>
  <input type="password" id="키입력" placeholder="sk-ant-...">
  <div class="안내">
    <b>안 넣어도 앱은 돌아갑니다.</b> 넣으면 대화가 훨씬 자연스러워집니다.<br>
    키는 이 브라우저에만 저장되고 어디로도 전송되지 않습니다.<br>
    <b style="color:#9a3412">주의</b> — 발표·공유용 화면에서는 키를 지우세요.
  </div>
  <div id="연결상태" class="안내"></div>

  <button class="go" style="background:#eef1f5;color:#374151" onclick="설정닫기()">닫기</button>
  <button class="go" style="background:#eef1f5;color:#374151" onclick="오늘초기화()">오늘 대화 지우기</button>
  <button class="go" style="background:#fee2e2;color:#991b1b" onclick="전체초기화()">전부 지우고 처음부터</button>
</div></div>


<!-- ═══ C 의 파일 · A 의 파일을 먼저 읽어들입니다. 순서 바꾸지 마세요 ═══ -->
<script src="data.js"></script>
<script src="talk.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   index.html  —  B 가 혼자 쓰는 파일
   채팅 화면, 저장, AI 호출.  data.js · talk.js 는 열지 않습니다.

   [한 줄이 들어오면 이 순서로 처리합니다]
     1. 입력검사(A)   — 증상·약이면 AI를 부르지 않고 바로 막는다
     2. AI 호출 or 규칙으로답하기(A)
     3. 출력검사(A)   — AI 답에 금지어가 있으면 갈아끼운다
     4. 화면에 표시 + 기록 반영
   ═══════════════════════════════════════════════════════════ */

/* ═══ 카카오 지도 키 ═══════════════════════════════════════
   아래 따옴표 안에 카카오 JavaScript 키를 붙여넣으세요. 이 줄만 고치면 됩니다.

     developers.kakao.com → 내 애플리케이션 → 앱 키 → JavaScript 키

   ★ 반드시 [플랫폼 → Web] 에 아래 두 주소를 등록하세요.
     등록해야만 우리 사이트에서만 동작합니다. 이게 유일한 보호 장치입니다.
       https://jollyybeeeee-max.github.io
       http://localhost:8777

   비워두면 "근처 가게" 기능만 빠지고 앱은 그대로 돌아갑니다.
   ※ 이 키는 공개돼도 되는 키입니다. Anthropic 키는 절대 여기 넣지 마세요. */
const 카카오키 = "여기에_카카오_JavaScript_키_붙여넣기";

const 저장키 = "harufit-v2";
let 상태 = { 프로필:null, 키:"", 오늘:{ 날짜:오늘날짜(), 컨디션:null, 일정:null, 기록:[], 대화:[] } };
let 보내는중 = false;

function 오늘날짜(){ return new Date().toISOString().slice(0,10); }

let 저장가능 = true;
function 저장(){
  if(!저장가능) return;
  try{ localStorage.setItem(저장키, JSON.stringify(상태)); }
  catch(e){ 저장가능 = false; console.warn("저장이 안 되는 환경입니다. 앱은 그대로 쓸 수 있습니다."); }
}
function 불러오기(){
  try{
    const raw = localStorage.getItem(저장키);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.프로필) 상태.프로필 = d.프로필;
    if(d.키) 상태.키 = d.키;
    if(d.오늘 && d.오늘.날짜 === 오늘날짜()) 상태.오늘 = d.오늘;
    else if(d.오늘) 상태.어제 = d.오늘;
  }catch(e){ /* 깨진 저장본은 무시 */ }
}

/* ── 화면 ── */
function 말풍선(누가, 글, 경고){
  const d = document.createElement("div");
  d.className = "말 " + (누가==="나" ? "나" : "앱") + (경고 ? " 경고" : "");
  d.textContent = 글;
  document.getElementById("대화").appendChild(d);
  아래로();
  return d;
}
function 아래로(){
  const c = document.getElementById("대화");
  c.scrollTop = c.scrollHeight;
}
function 대화그리기(){
  document.getElementById("대화").innerHTML = "";
  상태.오늘.대화.forEach(m => 말풍선(m.누가, m.글, m.경고));
  if(상태.오늘.대화.length === 0){
    앱말(문장만들기(상태.프로필.말투, "첫인사", {}));
  }
}
function 앱말(글, 경고){
  상태.오늘.대화.push({ 누가:"앱", 글, 경고:!!경고 });
  말풍선("앱", 글, 경고);
  저장();
}
function 내말(글){
  상태.오늘.대화.push({ 누가:"나", 글 });
  말풍선("나", 글);
  저장();
}

/* 사진을 올린 경우 — 화면에는 사진을 보여주고, 저장에는 글자만 남깁니다.
   사진 자체를 저장하면 브라우저 저장 공간이 금방 꽉 찹니다. */
function 내사진(미리보기, 글){
  상태.오늘.대화.push({ 누가:"나", 글: 글 || "📷 사진" });
  const d = 말풍선("나", 글 || "📷 사진");
  const img = document.createElement("img");
  img.src = 미리보기;
  d.prepend(img);
  img.onload = 아래로;
  저장();
}

function 숫자갱신(){
  if(!상태.프로필) return;
  const 기준 = 기준값계산(상태.프로필);                       // ← data.js
  const 먹은kcal = 상태.오늘.기록.reduce((a,b)=>a+b.kcal,0);
  const 먹은단백질 = 상태.오늘.기록.reduce((a,b)=>a+b.단백질,0);
  document.getElementById("남은칼로리").textContent = 기준.목표kcal - 먹은kcal;
  document.getElementById("남은단백질").textContent = 기준.목표단백질 - 먹은단백질;
}

/* ── 위치 ──────────────────────────────────────────────
   두 가지 방법이 있습니다.
     주소 입력 : 지금까지 쓰던 방식. 식당표의 고정 거리를 씁니다.
     현재 위치 : GPS. 카카오로 진짜 근처 가게를 찾아옵니다.
   GPS 는 [현재 위치 쓰기] 를 눌렀을 때만 씁니다. 몰래 읽지 않습니다. */
function 현재위치받기(){
  return new Promise((성공, 실패) => {
    if(!navigator.geolocation) return 실패(new Error("이 브라우저는 위치 기능이 없습니다"));
    navigator.geolocation.getCurrentPosition(
      p => 성공({ 위도:p.coords.latitude, 경도:p.coords.longitude }),
      e => 실패(new Error(e.code === 1 ? "위치 권한이 거부됐습니다" : "위치를 받지 못했습니다")),
      { enableHighAccuracy:true, timeout:8000, maximumAge:60000 }
    );
  });
}

let 새좌표 = undefined;   // undefined = 안 누름 · null = 실패 · {} = 성공
async function 현재위치쓰기(){
  const 안내 = document.getElementById("위치안내");
  안내.textContent = "위치를 확인하는 중…";
  try{
    새좌표 = await 현재위치받기();
    안내.innerHTML = '<b style="color:#0f766e">현재 위치를 쓰겠습니다.</b> ' +
                     '근처 가게를 실제 거리로 찾아줍니다.';
  }catch(e){
    새좌표 = null;
    안내.innerHTML = '<b style="color:#9a3412">' + e.message + '</b><br>' +
                     '괜찮습니다. 위에 적어주신 주소로 씁니다.';
  }
}

/* ── 카카오 지도 불러오기 ── 키가 있을 때만, 딱 한 번만 ── */
let 카카오준비 = null;
function 카카오불러오기(){
  if(카카오준비) return 카카오준비;
  if(!카카오키 || 카카오키.indexOf("여기에") === 0){
    카카오준비 = Promise.reject(new Error("카카오 키가 아직 없습니다"));
    return 카카오준비;
  }
  카카오준비 = new Promise((성공, 실패) => {
    const s = document.createElement("script");
    s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + 카카오키 +
            "&libraries=services&autoload=false";
    s.onload  = () => kakao.maps.load(() => 성공(true));

/* ── 부족분 채우기 카드 ──────────────────────────────────
   두 묶음으로 나눠서 보여줍니다. 이게 이 앱의 핵심 원칙입니다.

     우리가 아는 곳 : C가 재료를 적어둔 목록. 안전검사로 걸러냅니다.
     근처 가게      : 카카오에서 온 진짜 가게. 재료를 모르므로 거르지 않고,
                      모른다고 화면에 적습니다.

   모르는 걸 아는 척하지 않습니다. */
function 채움카드(){
  const 기준 = 기준값계산(상태.프로필);
  const 남은단백질 = 기준.목표단백질 - 상태.오늘.기록.reduce((a,b)=>a+b.단백질,0);
  if(남은단백질 <= 15 || 상태.오늘.기록.length === 0) return;

  const 통과 = 안전검사(식당표, 상태.프로필.못먹는것)           // ← talk.js + data.js
               .filter(m => m.거리 <= 500)
               .sort((a,b)=>b.단백질-a.단백질)
               .slice(0,3);

  const 좌표 = 상태.프로필.좌표;
  if(!통과.length && !좌표) return;

  const d = document.createElement("div");
  d.className = "채움";
  d.innerHTML = "<b>" + 문장만들기(상태.프로필.말투,"부족",{g:남은단백질}) + "</b> " +
                (좌표 ? "지금 있는 곳" : 상태.프로필.위치) + " 기준 500m 안이야.";

  if(통과.length){
    const 묶음 = document.createElement("div");
    묶음.className = "묶음 아는곳";
    묶음.innerHTML = '<div class="묶음제목">우리가 아는 곳 <span>재료까지 확인함</span></div>' +
      통과.map(m => '<button onclick="메뉴탭(\''+m.메뉴+'\')">'+
        m.가게+' · '+m.메뉴+' — '+m.거리+'m · 단백질 '+m.단백질+'g</button>').join("");
    d.appendChild(묶음);
  }

  document.getElementById("대화").appendChild(d);
  아래로();

  if(좌표) 근처가게붙이기(d, 좌표);
}

/* 카카오 결과를 카드에 덧붙입니다. 실패해도 위 카드는 그대로 남습니다. */
async function 근처가게붙이기(카드, 좌표){
  const 기다림 = document.createElement("div");
  기다림.className = "찾는중";
  기다림.textContent = "근처 가게를 찾는 중…";
  카드.appendChild(기다림);
  아래로();

  let 가게들;
  try{
    가게들 = await 근처가게찾기(좌표, 500);
  }catch(e){
    console.warn("근처 가게를 못 가져왔습니다 —", e.message);
    기다림.remove();
    return;                    // 조용히 접습니다. 우리 목록은 이미 떠 있습니다.
  }
  기다림.remove();
  if(!가게들.length) return;

  /* 가게 이름·업종에서 아는 음식을 찾아봅니다.
     찾으면 진짜 숫자를, 못 찾으면 대략값을 씁니다.
       칼로리는 틀려도 숫자가 어긋날 뿐이지만,
       재료는 모르면 위험하므로 아래에 "모른다"고 적습니다. */
  const 목록 = 가게들.slice(0, 4).map(g => {
    const 아는음식 = 음식찾기(g.place_name + " " + g.category_name);   // ← data.js
    return {
      이름: g.place_name,
      거리: Number(g.distance) || 0,
      업종: (g.category_name || "").split(">").pop().trim(),
      링크: g.place_url,
      kcal: 아는음식 ? 아는음식.kcal : 400,
      단백질: 아는음식 ? 아는음식.단백질 : 12,
      앎: !!아는음식,
      기준메뉴: 아는음식 ? 아는음식.이름 : null
    };
  }).sort((a,b) => (b.앎 - a.앎) || (a.거리 - b.거리));

  const 묶음 = document.createElement("div");
  묶음.className = "묶음 모름";
  묶음.innerHTML =
    '<div class="묶음제목">근처 가게 <span>카카오맵 · 재료 정보 없음</span></div>' +
    목록.map(m =>
      '<button onclick="근처탭(this)" data-kcal="' + m.kcal + '" data-단백질="' + m.단백질 +
      '" data-이름="' + m.이름.replace(/"/g, "") + '">' +
      m.이름 + ' · ' + m.거리 + 'm · ' + m.업종 + '<br>' +
      (m.앎 ? m.기준메뉴 + ' 기준 대략 ' + m.kcal + 'kcal · 단백질 ' + m.단백질 + 'g'
            : '칼로리 정보 없음 — 대략 ' + m.kcal + 'kcal로 잡음') +
      '</button>').join("") +
    '<div class="주의">가게마다 재료가 달라. 못 먹는 게 있으면 주문할 때 꼭 물어봐.</div>' +
    목록.filter(m => m.링크).map(m =>
      '<a class="메뉴링크" href="' + m.링크 + '" target="_blank" rel="noopener">' +
      m.이름 + ' 메뉴 보기</a>').join(" ");

  카드.appendChild(묶음);
  아래로();
}

/* 긴 쪽을 1024px 로 줄이고 JPEG 로 다시 만듭니다 */
function 사진줄이기(파일, 최대){
  return new Promise((성공, 실패) => {
    const reader = new FileReader();
    reader.onerror = () => 실패(new Error("사진을 읽지 못했습니다"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => 실패(new Error("사진 형식을 알 수 없습니다"));
      img.onload = () => {
        const 비율 = Math.min(1, 최대 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width  = Math.round(img.width  * 비율);
        c.height = Math.round(img.height * 비율);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", 0.8);
        성공({ 미리보기:url, base64:url.split(",")[1] });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(파일);
  });
}

async function 사진골랐다(칸){

/* 글이든 사진이든 여기서 처리합니다. 사진이면 입력검사를 건너뜁니다 —
   그림에는 검사할 글자가 없습니다. 출력검사는 사진일 때도 그대로 합니다. */
async function 답받기(글, 사진){
  // 1. 입력 검사 — AI를 부르기 전에 막는다
  const 막기 = 사진 ? { 막힘:false } : 입력검사(글);            // ← talk.js
  if(막기.막힘){ 앱말(막기.답, true); return; }

  보내는중 = true;
  document.getElementById("보내기버튼").disabled = true;
  document.getElementById("사진버튼").disabled = true;
  const 기다림 = document.createElement("div");
  기다림.className = "생각중";
  기다림.textContent = 사진 ? "사진 보는 중…" : "생각 중…";
  document.getElementById("대화").appendChild(기다림);
  아래로();

  let 결과;
  try{
    // 2. AI 호출 (키가 있으면) 또는 규칙으로 답하기
    결과 = 상태.키 ? await AI에게물어보기(글, 사진) : 규칙으로답하기(글, 상태.프로필, 상태.오늘);
  }catch(e){
    console.warn("AI 호출 실패 — 규칙으로 대신합니다:", e.message);
    결과 = 사진
      ? { 종류:"기타", 음식:[], 컨디션:null, 일정:null,
          답:"사진을 못 알아봤어. 뭘 먹었는지 글로 적어줄래?" }
      : 규칙으로답하기(글, 상태.프로필, 상태.오늘);            // ← talk.js
  }
  기다림.remove();

  // 3. 출력 검사 — AI 답에 금지어가 있으면 갈아끼운다
  const 검사 = 출력검사(결과.답 || "");                        // ← talk.js
  앱말(검사.답, 검사.막힘);

  // 4. 기록 반영
  if(결과.컨디션) 상태.오늘.컨디션 = 결과.컨디션;
  if(결과.일정)   상태.오늘.일정   = 결과.일정;
  (결과.음식 || []).forEach(m => {
    상태.오늘.기록.push({ 이름:m.이름, kcal:m.kcal, 단백질:m.단백질 });
  });
  저장(); 숫자갱신();
  if(결과.종류 === "음식") 채움카드();

  보내는중 = false;
  document.getElementById("보내기버튼").disabled = false;
  document.getElementById("사진버튼").disabled = false;
  document.getElementById("입력").focus();
}

/* ── AI 호출 ──
   브라우저에서 직접 부르므로 anthropic-dangerous-direct-browser-access 헤더가 필요합니다.
   file:// 로 열면 막힙니다 — 로컬 서버나 GitHub Pages에서 열어야 합니다.

   사진이 있으면 마지막 차례에 사진을 같이 붙입니다. 사진은 저장하지 않고
   이번 요청에만 씁니다. */
async function AI에게물어보기(글, 사진){
  let 최근 = 상태.오늘.대화.slice(-8).map(m => ({
    role: m.누가==="나" ? "user" : "assistant",
    content: m.글
  }));
  // 첫 차례는 반드시 사용자여야 합니다. 앱 인사말로 시작하면 잘라냅니다.
  while(최근.length && 최근[0].role === "assistant") 최근.shift();
  if(!최근.length) 최근 = [{ role:"user", content:글 }];

  if(사진){
    최근[최근.length - 1] = {
      role: "user",
      content: [
        { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:사진 } },
        { type:"text", text:글 }
      ]
    };
  }

  const 응답 = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": 상태.키,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-opus-5",
      max_tokens: 2048,
      output_config: {
        effort: "low",
        format: { type: "json_schema", schema: 답변형식 }        // ← talk.js
      },
      system: 시스템지시문(상태.프로필, 상태.오늘),               // ← talk.js
      messages: 최근
    })
  });

  if(!응답.ok){
    const t = await 응답.text();
    throw new Error("API " + 응답.status + " " + t.slice(0,200));
  }
  const data = await 응답.json();

  // 거절당했으면 규칙으로 넘긴다
  if(data.stop_reason === "refusal") throw new Error("refusal");

  const 글블록 = (data.content || []).find(b => b.type === "text");
  if(!글블록) throw new Error("빈 응답");
  return JSON.parse(글블록.text);
}

function 설문저장(){
  const 고치기 = !!상태.프로필;
  const 이전금기 = 고치기 ? 상태.프로필.못먹는것.slice() : [];
  const 이전좌표 = 고치기 ? 상태.프로필.좌표 : null;

  /* 좌표 — 이번에 [현재 위치]를 눌렀으면 그 값, 안 눌렀으면 원래 값을 유지합니다.
     눌렀는데 실패했으면(null) 주소 방식으로 돌아갑니다. */
  const 좌표 = (새좌표 === undefined) ? (이전좌표 || null) : 새좌표;

  const 프로필 = {
    키:+document.getElementById("키").value,
    현재체중:+document.getElementById("현재체중").value,
    목표체중:+document.getElementById("목표체중").value,
    기간주:+document.getElementById("기간주").value,
    못먹는것:[...document.querySelectorAll('#금기칸 input:checked')]
              .map(i=>i.value).filter(v=>v!=="없음"),
    위치:document.getElementById("위치").value,
    좌표:좌표,
    말투:선택값("말투칸") || "엄마"
  };
  const 경고 = document.getElementById("설문경고");
  if(document.querySelectorAll('#금기칸 input:checked').length === 0){
    경고.innerHTML = '<div class="경고상자">못 먹는 것을 확인해 주세요. 없으면 <b>[없음]</b>을 눌러야 넘어갑니다.</div>';
    return;
  }
  const 판정 = 목표안전한가(프로필);                            // ← data.js
  if(!판정.ok){ 경고.innerHTML = '<div class="경고상자">'+판정.메시지+'</div>'; return; }

  경고.innerHTML = "";
  상태.프로필 = 프로필;
  저장();
  document.getElementById("판-설문").classList.add("hide");

  if(!고치기){ 대화그리기(); 숫자갱신(); return; }

  // ── 고친 경우 ──
  숫자갱신();
  // ★ 못 먹는 것이 바뀌었으면, 이미 화면에 떠 있는 추천을 다시 검사한다.
  //   안 그러면 방금 등록한 금기가 든 메뉴가 화면에 그대로 남는다.
  const 금기바뀜 = 이전금기.join() !== 프로필.못먹는것.join();
  if(금기바뀜) 카드재검사();
  앱말(바뀐것안내(이전금기, 프로필));
}

/* 화면에 남아 있는 추천 카드를 새 금기로 다시 거른다.
   ★ "우리가 아는 곳" 묶음에만 적용합니다.
     "근처 가게"는 애초에 재료를 모르는 곳이라 거르지 않습니다.
     거르는 시늉을 하면 안전하다고 오해하게 됩니다. */
function 카드재검사(){
  document.querySelectorAll(".채움").forEach(카드 => {
    const 아는곳 = 카드.querySelector(".묶음.아는곳");
    if(아는곳){
      let 남은개수 = 0;
      아는곳.querySelectorAll("button").forEach(b => {
        const 메뉴 = (b.getAttribute("onclick").match(/'([^']+)'/) || [])[1];
        const m = 식당표.find(x => x.메뉴 === 메뉴);
        const 통과 = m && 안전검사([m], 상태.프로필.못먹는것).length > 0;   // ← talk.js
        if(통과) 남은개수++; else b.remove();
      });
      if(남은개수 === 0) 아는곳.remove();
    }
    // 두 묶음이 다 비었으면 카드째 지운다
    if(!카드.querySelector(".묶음")) 카드.remove();
  });
}

function 바뀐것안내(이전금기, p){
  const 새금기 = p.못먹는것.filter(x => !이전금기.includes(x));
  const 기준 = 기준값계산(p);
  let 글 = "알겠어. 이제 하루 " + 기준.목표kcal + "kcal, 단백질 " + 기준.목표단백질 + "g으로 볼게.";
  if(새금기.length) 글 += "\n" + 새금기.join(", ") + " 들어간 건 앞으로 추천 안 할게.";
  return 글;
}
function 설정열기(){
  document.getElementById("키입력").value = 상태.키 || "";
  document.querySelectorAll("#말투칸2 button").forEach(b=>
    b.classList.toggle("on", b.dataset.v === (상태.프로필 && 상태.프로필.말투)));
  프로필요약그리기();
  연결상태그리기();
  document.getElementById("판-설정").classList.remove("hide");
}
function 프로필요약그리기(){
  const p = 상태.프로필;
  if(!p) return;
  document.getElementById("프로필요약").innerHTML =
    "지금 — " + p.현재체중 + "kg → " + p.목표체중 + "kg (" + p.기간주 + "주) · " +
    "못 먹는 것: " + (p.못먹는것.join(", ") || "없음") + " · " +
    (p.좌표 ? "위치: 현재 위치 사용 중" : p.위치);
}
function 설정닫기(){
  상태.키 = document.getElementById("키입력").value.trim();
  저장();
  document.getElementById("판-설정").classList.add("hide");
}
function 연결상태그리기(){
  const el = document.getElementById("연결상태");
  const file = location.protocol === "file:";
  el.innerHTML = file
    ? '<b style="color:#9a3412">지금은 파일을 직접 열어서 AI 연결이 안 됩니다.</b><br>로컬 서버나 GitHub Pages로 열어야 합니다. (AI 없이도 앱은 그대로 돌아갑니다)'
    : (상태.키 ? "AI 연결됨" : "AI 미연결 — 준비된 답으로 대신합니다");
}
function 오늘초기화(){
  상태.오늘 = { 날짜:오늘날짜(), 컨디션:null, 일정:null, 기록:[], 대화:[] };
  저장(); 대화그리기(); 숫자갱신(); 설정닫기();
}
function 전체초기화(){ try{ localStorage.removeItem(저장키); }catch(e){} location.reload(); }

/* ── 시작 ── */
불러오기();
금기칸그리기();
버튼묶음("말투칸");
버튼묶음("말투칸2", v=>{ if(상태.프로필){ 상태.프로필.말투=v; 저장(); } });
if(상태.프로필){
  대화그리기(); 숫자갱신();
} else {
  설문열기();
}
</script>
